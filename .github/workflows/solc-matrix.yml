name: solc-matrix
# Parity and sharding check against released solc binaries, oldest supported to newest.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1'   # weekly: catches a new solc release changing standard-json
permissions:
  contents: read
jobs:
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solc: ['0.5.17', '0.6.12', '0.7.6', '0.8.0', '0.8.13', '0.8.19', '0.8.24', '0.8.30', '0.8.37']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no dependencies, no go.sum
      - run: go build -o solc-par .
      - name: fetch solc ${{ matrix.solc }}
        run: |
          curl -sSfL -o solc "https://github.com/ethereum/solidity/releases/download/v${{ matrix.solc }}/solc-static-linux"
          chmod +x solc && ./solc --version
      - run: bench/compat.sh ./solc
      - run: bench/errpath.sh ./solc
        if: ${{ !startsWith(matrix.solc, '0.5') && !startsWith(matrix.solc, '0.6') && !startsWith(matrix.solc, '0.7') }}
  latest:
    # The newest release, whatever it is: a new solc must not silently change the contract.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # no dependencies, no go.sum
      - run: go build -o solc-par .
      - run: |
          curl -sSfL -o solc "https://github.com/ethereum/solidity/releases/latest/download/solc-static-linux"
          chmod +x solc && ./solc --version
      - run: bench/compat.sh ./solc
